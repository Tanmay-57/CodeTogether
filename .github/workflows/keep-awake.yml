name: Keep the API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request health
        run: curl --fail --show-error --retry 3 --retry-all-errors --retry-delay 15 --max-time 120 https://codetogether-server-32bz.onrender.com/health
