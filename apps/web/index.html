<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeTogether is a browser workspace for writing code together in real time." />
    <title>CodeTogether</title>
    <script>
      try {
        if (localStorage.getItem('codetogether.theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
      } catch {
        /* Storage can be unavailable in private modes. Dark stays the default. */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
